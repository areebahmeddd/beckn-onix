# ONIX adapter node configured by install/beckn-onix.sh. Run from install/:
#
#   docker compose --env-file ../config/onix-node/compose.env \
#     -f docker-compose-onix-node.yml up -d
#
# Redis is private to this node. The "both" profile (set in compose.env for a
# BAP + BPP node) adds a second Redis so the two roles do not share a payload
# store.
services:
  redis-onix-node:
    image: redis:alpine
    container_name: redis-onix-node
    restart: unless-stopped
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-onix-node-bpp:
    image: redis:alpine
    container_name: redis-onix-node-bpp
    restart: unless-stopped
    profiles: ["both"]
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  onix-node:
    image: ${ONIX_IMAGE:-fidedocker/onix-adapter}
    container_name: onix-node
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis-onix-node:
        condition: service_healthy
    networks:
      - beckn_network
    ports:
      - "${ONIX_BIND_ADDRESS:-127.0.0.1}:${ONIX_HOST_PORT:-8081}:8081"
    volumes:
      - ../config:/app/config:ro
    command: ["./server", "--config=/app/config/onix-node/adapter.yaml"]

networks:
  beckn_network:
    name: beckn_network
    driver: bridge
